fields:
    title:
        type: text
        label: Page title
        default: Theo Brandt — Design engineer
    description:
        type: textarea
        label: Meta description
        rows: 3
        default: Design engineer in Copenhagen. I build interfaces, write about the parts that resist a process, and keep a short list of things I am working on.
    showPattern:
        type: toggle
        label: Show the dot-paper texture
        default: "1"
    showPreviews:
        type: toggle
        label: Show pointer previews on list rows
        default: "1"
